alias: "Meters — close alert"
description: >-
  Sends the company submitter one admin alert at 10:05 when a meter's reporting
  window closed within the last 24 hours and that meter still has no submission
  for the period. reading_mode: external meters are skipped. An unavailable or
  missing submission sensor is treated as unknown, not as unreported. A
  malformed meter is skipped without aborting the loop.
mode: single
triggers:
  - trigger: time
    at: "10:05:00"
actions:
  - variables:
      meters: "{{ (state_attr('sensor.meters_config', 'meters') or []) | select('mapping') | list }}"
      houses: "{{ (state_attr('sensor.meters_config', 'houses') or []) | select('mapping') | list }}"
      routes: "{{ state_attr('sensor.meter_operations', 'routes') or {} }}"
  - repeat:
      for_each: "{{ meters }}"
      sequence:
        - variables:
            meter: "{{ repeat.item }}"
            alert: >-
              {% set meter_id = meter.get('id') %}
              {% set w = meter.get('window') %}
              {% set external = meter.get('reading_mode', 'manual') == 'external' or meter.get('reporting', 'manual') in ['smart', 'sensor'] %}
              {% if meter_id is not string or not meter_id or external or w is not mapping %}
                {{ {'due': false, 'reason': 'external or no reporting window'} | tojson }}
              {% else %}
                {% set n = now() %}
                {% set od = w.get('open_day', 1) | int %}
                {% set cd = w.get('close_day', 1) | int %}
                {% set ot = ((w.get('open_time') or '00:00') | string).split(':') + ['0', '0'] %}
                {% set ct = ((w.get('close_time') or '23:59') | string).split(':') + ['0', '0'] %}
                {% set oh = [ot[0] | int, 23] | min %}
                {% set oh = [oh, 0] | max %}
                {% set om = [ot[1] | int, 59] | min %}
                {% set om = [om, 0] | max %}
                {% set ch = [ct[0] | int, 23] | min %}
                {% set ch = [ch, 0] | max %}
                {% set cm = [ct[1] | int, 59] | min %}
                {% set cm = [cm, 0] | max %}
                {% set this_month_end = ((n.replace(day=1) + timedelta(days=32)).replace(day=1) - timedelta(days=1)).day %}
                {% set open_day_this = [od, this_month_end] | min %}
                {% set open_day_this = [open_day_this, 1] | max %}
                {% set open_this = n.replace(day=open_day_this, hour=oh, minute=om, second=0, microsecond=0) %}
                {% set close_base = (n.replace(day=1) + timedelta(days=32)).replace(day=1) if cd < od else n %}
                {% set close_month_end = ((close_base.replace(day=1) + timedelta(days=32)).replace(day=1) - timedelta(days=1)).day %}
                {% set close_day_this = [cd, close_month_end] | min %}
                {% set close_day_this = [close_day_this, 1] | max %}
                {% set close_this = close_base.replace(day=close_day_this, hour=ch, minute=cm, second=0, microsecond=0) %}
                {% set prev = n.replace(day=1) - timedelta(days=1) %}
                {% set open_day_prev = [od, prev.day] | min %}
                {% set open_day_prev = [open_day_prev, 1] | max %}
                {% set open_prev = prev.replace(day=open_day_prev, hour=oh, minute=om, second=0, microsecond=0) %}
                {% set close_prev_base = (prev.replace(day=1) + timedelta(days=32)).replace(day=1) if cd < od else prev %}
                {% set close_prev_month_end = ((close_prev_base.replace(day=1) + timedelta(days=32)).replace(day=1) - timedelta(days=1)).day %}
                {% set close_day_prev = [cd, close_prev_month_end] | min %}
                {% set close_day_prev = [close_day_prev, 1] | max %}
                {% set close_prev = close_prev_base.replace(day=close_day_prev, hour=ch, minute=cm, second=0, microsecond=0) %}
                {% if close_prev <= n and (n - close_prev).total_seconds() <= 86400 %}
                  {% set period = prev.strftime('%Y-%m') %}
                  {% set chosen_close = close_prev %}
                  {% set closed = true %}
                {% elif close_this <= n and (n - close_this).total_seconds() <= 86400 %}
                  {% set period = n.strftime('%Y-%m') %}
                  {% set chosen_close = close_this %}
                  {% set closed = true %}
                {% else %}
                  {% set period = n.strftime('%Y-%m') %}
                  {% set chosen_close = close_this %}
                  {% set closed = false %}
                {% endif %}
                {% set sensor = 'sensor.submission_' ~ (meter_id | string | replace('-', '_')) %}
                {% set last = states(sensor) %}
                {% set known = last not in ['unknown', 'unavailable', 'none', 'None', ''] %}
                {% set house_id = meter.get('house_id') or '' %}
                {% set house_matches = houses | selectattr('id', 'equalto', house_id) | list if house_id else [] %}
                {% set house = house_matches[0] if house_matches else none %}
                {% set house_name = (house.get('name') or house_id) if house else (house_id or 'Casa') %}
                {% set route = routes.get(meter_id) if routes is mapping else none %}
                {% set route_target = (route.get('target') if route is mapping else none) or 'company_submitter' %}
                {% set luni = ['ianuarie', 'februarie', 'martie', 'aprilie', 'mai', 'iunie', 'iulie', 'august', 'septembrie', 'octombrie', 'noiembrie', 'decembrie'] %}
                {% set period_label = luni[(period.split('-')[1] | int) - 1] ~ ' ' ~ period.split('-')[0] %}
                {{ {
                  'due': closed and known and last != period,
                  'unknown': closed and not known,
                  'name': meter.get('name') or meter_id,
                  'house_name': house_name,
                  'period': period,
                  'period_label': period_label,
                  'close_label': chosen_close.strftime('%d.%m.%Y %H:%M'),
                  'route_target': route_target
                } | tojson }}
              {% endif %}
        - variables:
            d: "{{ alert | from_json }}"
        - if:
            - condition: template
              value_template: "{{ d.due }}"
          then:
            - action: script.notify_admin
              continue_on_error: true
              data:
                title: "Fereastră închisă — {{ d.house_name }}"
                message: >-
                  {{ d.name }}: fereastra pentru {{ d.period_label }} s-a închis
                  la {{ d.close_label }} și nu există nicio trimitere.
                  Responsabil: {{ 'index submitter' if d.route_target == 'index_submitter' else 'company submitter' }}.
                data:
                  url: "https://YOUR_GITHUB_USER.github.io/report-consumption/admin.html"
                  url_title: "Deschide administrarea"
