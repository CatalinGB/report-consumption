# Import this file as a script. The alias is deliberately `ntfy_notify`, so a
# UI import creates script.ntfy_notify. When loading it from
# configuration.yaml, key it explicitly:
#
#   script:
#     ntfy_notify: !include ha/ntfy_notify.yaml
#
# One HTTPS POST to ntfy through `rest_command.ntfy_publish` (see
# ha/rest_command-ntfy.example.yaml). No MQTT hop and no listener process.
#
# The publish URL (including the topic) is the HA secret `ntfy_url` in
# secrets.yaml; it is never in this repository, in MQTT or in a message.
#
# Do not pass PII: no house/meter name, index, period, address, contract/client
# code, token or installation id. Admin callers must use script.notify_admin.
alias: "ntfy_notify"
description: >-
  Publish one generic ntfy notification over HTTPS. `action_label` is the label
  the ntfy action button uses when `url` is set.
fields:
  title:
    name: Title
    description: Short notification title.
    required: true
    selector:
      text:
  message:
    name: Message
    description: Notification body.
    required: true
    selector:
      text:
        multiline: true
  priority:
    name: Priority
    description: ntfy priority (min, low, default, high, max, or 1-5).
    default: default
    selector:
      text:
  tags:
    name: Tags
    description: Comma-separated ntfy tags, for example bell,warning.
    default: bell
    selector:
      text:
  url:
    name: Click URL
    description: Optional URL opened when the notification is tapped.
    default: ""
    selector:
      text:
  action_label:
    name: Action label
    description: Visible label for the URL action, for example "Deschide pagina de raportare".
    default: "Open link"
    selector:
      text:

sequence:
  - if:
      - condition: template
        value_template: >-
          {{ url is defined and url != "" and (("?" in url) or ("#" in url)) }}
    then:
      - stop: "refusing notification URL with query/fragment identifier"

  - action: rest_command.ntfy_publish
    data:
      msg: "{{ message }}"
      title: "{{ title }}"
      priority: "{{ priority | default('default') }}"
      tags: "{{ tags | default('bell') }}"
      click_url: "{{ url | default('') }}"
      label: "{{ action_label | default('Open link') }}"

mode: parallel
max: 20
